function metricOf(r){if(r.id==='subs')return'subs';if(r.id==='contracts')return'contracts';if(r.id==='small')return'small';if(r.id==='wknd')return'wknd';if(r.id.startsWith('up_'))return'rec:'+r.id.split('_')[1];return r.cat?'cat:'+r.cat:null}
function metric(key,ym,upto){const l=txIn(ym,upto).filter(t=>t.type==='exp');if(key.startsWith('cat:'))return sum(l.filter(t=>t.cat===key.slice(4)),t=>t.amount);if(key.startsWith('rec:'))return sum(l.filter(t=>t.rec===key.slice(4)),t=>t.amount);if(key==='subs')return sum(l.filter(t=>t.cat==='predplatne'),t=>t.amount);if(key==='contracts')return sum(l.filter(t=>['pojisteni','energie','telefon'].includes(t.cat)),t=>t.amount);if(key==='small')return sum(l.filter(t=>t.amount<150&&!t.rec),t=>t.amount);if(key==='wknd')return sum(l.filter(t=>!t.rec&&[0,5,6].includes(parseD(t.date).getDay())),t=>t.amount);return 0}
function results(){const now=ymNow(),out=[];Object.entries(S.cfg.accepted||{}).forEach(([id,a])=>{if(!a||!a.m)return;const from=a.d.slice(0,7);const full=[];for(let m=from;m<now;m=addM(m,1))if(hasData(m))full.push(m);let cur,lbl;if(full.length){cur=sum(full,m=>metric(a.m,m))/full.length;lbl=`průměr za ${full.length} ${full.length===1?'měsíc':full.length<5?'měsíce':'měsíců'}`}else{const day=+today().slice(8),D=dim(now);cur=metric(a.m,now)/Math.max(day,1)*D;lbl='odhad podle tohoto měsíce'}out.push({id,name:a.t,since:a.d,base:a.base,cur,diff:a.base-cur,lbl})});return out.sort((x,y)=>y.diff-x.diff)}
const resultsH=()=>{const R=results();if(!R.length)return'';const tot=sum(R,r=>r.diff);return`<section class="card c12"><h2>Výsledky opatření <span>${tot>=0?'zatím ušetřeno':'zatím dražší o'} ${kc(Math.abs(tot))} měsíčně</span></h2>${R.map(r=>`<div class="res"><b>${esc(r.name)}</b><span class="num ${r.diff>=0?'ok':'up'}">${skc(-r.diff).replace('+','+')}</span><small>Od ${dL(r.since)}: ${kc(r.base)} předtím, teď ${kc(r.cur)} (${r.lbl})</small><button class="btn s" data-a="unaccept" data-id="${r.id}">Ukončit</button></div>`).join('')}</section>`};
A.accept=e=>{const r=recommendations().find(x=>x.id===e.dataset.id);if(!r)return;const m=metricOf(r);if(!m){toast('Tohle doporučení se měřit nedá.','e');return}const L=pastMonths(3);S.cfg.accepted[r.id]={d:today(),m,t:r.title,base:L.length?sum(L,x=>metric(m,x))/L.length:0};saveCfg();log(`Opatření: ${r.title}`);render();toast('Měřím od dneška. Výsledek uvidíš v Porovnání i tady.')};
A.unaccept=e=>{delete S.cfg.accepted[e.dataset.id];saveCfg();render()};
A.allLim=()=>{ui.allLim=!ui.allLim;render()};
const fixFold=id=>ui.fold.has(id)?'open':'';
A.fold=e=>{if(!matchMedia('(max-width:760px)').matches)return;const c=e.closest('.fold'),id=c.dataset.f;ui.fold.has(id)?ui.fold.delete(id):ui.fold.add(id);c.classList.toggle('open');drawCharts()};
const fc=(id,cls,title,body)=>`<section class="card ${cls} fold ${fixFold(id)}" data-f="${id}"><h2 data-a="fold">${title}</h2>${body}</section>`;
/* ---------- peníze ---------- */
const moved=(a,t)=>{const first=S.acct[0]&&S.acct[0].id===a.id;if(!((t.ts||0)>(a.atTs||0)))return 0;let v=0;if(t.type==='exp'&&(t.acct===a.id||(!t.acct&&first)))v-=t.amount;if(t.type==='inc'&&(t.acct===a.id||(!t.acct&&first)))v+=t.amount;if((t.type==='sav'||t.type==='trf')){if(t.acct===a.id)v-=t.amount;if(t.to===a.id)v+=t.amount}return v};
const acctBal=a=>a.balance+sum(S.tx,t=>moved(a,t));
function loanNow(l){const r=(l.rate||0)/1200;let B=l.balance;const ms=Math.max(0,(+today().slice(0,4)-+l.at.slice(0,4))*12+(+today().slice(5,7)-+l.at.slice(5,7)));for(let i=0;i<ms&&B>0;i++)B=Math.max(0,B*(1+r)-l.payment);return B}
function amort(B,r,P){if(B<=0)return{n:0,i:0};r=r/1200;if(P<=B*r)return null;let n=0,i=0;while(B>0&&n<1200){const x=B*r;i+=x;B=B+x-P;n++}return{n,i}}
const monthsTxt=n=>{const y=Math.floor(n/12),m=n%12;return(y?y+(y===1?' rok':y<5?' roky':' let'):'')+(y&&m?' a ':'')+(m||!y?m+(m===1?' měsíc':m>=2&&m<5?' měsíce':' měsíců'):'')};
function worth(){const a=sum(S.acct,acctBal),i=sum(S.inv,x=>x.value),l=sum(S.loans,loanNow);return{a,i,l,net:a+i-l}}
function settle(){const M=S.cfg.members,n=M.length,b=Object.fromEntries(M.map(m=>[m,0])),paid=Object.fromEntries(M.map(m=>[m,0]));if(n<2)return{b,tr:[],paid};S.tx.forEach(t=>{if(t.type==='exp'&&t.who&&t.who in b&&t.split!=='no'){b[t.who]+=t.amount;paid[t.who]+=t.date.startsWith(ymNow())?t.amount:0;M.forEach(m=>b[m]-=t.amount/n)}if(t.type==='set'&&t.who in b&&t.to in b){b[t.who]+=t.amount;b[t.to]-=t.amount}});const pos=M.filter(m=>b[m]>.5).map(m=>({m,v:b[m]})),neg=M.filter(m=>b[m]<-.5).map(m=>({m,v:-b[m]})),tr=[];pos.forEach(p=>neg.forEach(q=>{const x=Math.min(p.v,q.v);if(x>.5){tr.push({from:q.m,to:p.m,v:x});p.v-=x;q.v-=x}}));return{b,tr,paid}}
function moneyFields(){const ac=S.acct.length?fld('Z čeho',`<select id="fAc" class="in">${opts(S.acct.map(a=>[a.id,a.name]),F.acct||S.acct[0].id)}</select>`):'';const sp=S.cfg.members.length>1?`<label class="row"><span class="m"><b>Jen pro plátce</b><small>Nedělit do vyrovnání mezi vámi</small></span><input id="fSp" type="checkbox" class="chk" ${F.split==='no'?'checked':''}></label>`:'';return ac+sp}
V.penize=()=>{const w=worth(),s=settle(),KN={bank:'Účet',cash:'Hotovost',save:'Spoření'};return hdr('Peníze','Stav peněz, vyrovnání, úvěry a investice. Všechno zadáváš ručně.')+`<div class="grid">
 <section class="card hero c5"><div class="lbl">Čisté jmění</div><div class="big" data-count="${Math.round(w.net)}">${kc(w.net)}</div><div class="stats" style="grid-template-columns:1fr;margin-top:.5rem"><div class="stat"><small>Peníze</small><b>${kc(w.a)}</b></div><div class="stat"><small>Investice</small><b>${kc(w.i)}</b></div><div class="stat"><small>Dluhy</small><b>${kc(w.l)}</b></div></div></section>
 <section class="card c7"><h2>Stav peněz<button class="btn s r" data-a="trfNew">Převést</button><button class="btn s" data-a="acctNew">Přidat</button></h2>${S.acct.map(a=>`<button class="row" data-a="acctEdit" data-id="${a.id}"><span class="m"><b>${esc(a.name)}</b><small>${KN[a.kind]||'Účet'}</small></span><span class="am">${kc(acctBal(a))}</span></button>`).join('')||'<div class="empty">Přidej účet, hotovost nebo spoření a zadej aktuální zůstatek.</div>'}<p class="note">Zůstatky se dopočítávají ze zápisů v deníku. Občas je srovnej podle skutečnosti klepnutím na řádek.</p></section>
 <section class="card c6"><h2>Vyrovnání mezi vámi</h2>${s.tr.length?s.tr.map(t=>`<div class="row"><span class="m"><b>${esc(t.from)} → ${esc(t.to)}</b><small>Doplatek za společné výdaje napůl</small></span><span class="am">${kc(t.v)}</span><button class="btn s" data-a="setDone" data-v="${esc(t.from)}|${esc(t.to)}|${Math.round(t.v)}">Vyrovnáno</button></div>`).join(''):`<div class="empty">${S.cfg.members.length>1?'Jste vyrovnaní.':'Přidej v Nastavení druhého člena domácnosti.'}</div>`}<div class="bars">${S.cfg.members.map(m=>`<div class="bl"><div class="t">${esc(m)} tento měsíc zaplatil(a)</div><div class="v">${kc(s.paid[m]||0)}</div></div>`).join('')}</div></section>
 <section class="card c6"><h2>Úvěry a splátky<button class="btn s r" data-a="loanNew">Přidat</button></h2>${S.loans.map(l=>{const B=loanNow(l),am=amort(B,l.rate||0,l.payment),end=am?addM(ymNow(),am.n):null,p=l.original?clamp((1-B/l.original)*100,0,100):0;return`<button class="row" style="display:block" data-a="loanEdit" data-id="${l.id}"><div class="bl"><div class="t">${esc(l.name)}</div><div class="v">zbývá ${kc(B)}</div><div class="track"><i style="width:${p}%;background:var(--accent)"></i></div></div><small style="color:var(--ink3)">${am?`Splátka ${kc(l.payment)}, hotovo za ${monthsTxt(am.n)} (${mL(end)}), úroky ještě ${kc(am.i)}`:'Splátka nepokrývá úroky.'}</small></button>`}).join('')||'<div class="empty">Žádný úvěr. Přidej ho, pokud nějaký splácíte.</div>'}</section>
 <section class="card c12"><h2>Investice<button class="btn s r" data-a="invNew">Přidat</button></h2>${S.inv.map(x=>{const g=x.value-x.invested;return`<button class="row" data-a="invEdit" data-id="${x.id}"><span class="m"><b>${esc(x.name)}</b><small>Vloženo ${kc(x.invested)}${x.monthly?`, měsíčně ${kc(x.monthly)}`:''}, za 10 let při ${x.rate||0} % ročně asi ${kc(invFuture(x,120))}</small></span><span class="am">${kc(x.value)}<br><small class="${g>=0?'ok':'up'}">${skc(g)}</small></span></button>`}).join('')||'<div class="empty">Přidej fondy, akcie nebo stavební spoření a sleduj hodnotu.</div>'}<p class="note">Výhled je jen výpočet ze zadaného výnosu, skutečnost může být horší. Není to investiční doporučení.</p></section></div>`};
const invFuture=(x,n)=>{const r=(x.rate||0)/1200;let v=x.value;for(let i=0;i<n;i++)v=v*(1+r)+(x.monthly||0);return v};

A.setDone=e=>{const[from,to,v]=e.dataset.v.split('|');const t={id:uid(),date:today(),amount:+v,type:'set',cat:'vyrovnani',note:`${from} → ${to}`,who:from,to,ts:Date.now()};put('tx',t);log(`Vyrovnání ${from} → ${to}: ${kc(+v)}`);render();celebrate();toast('Vyrovnáno.','',()=>{del('tx',t.id);render()})};
function loanForm(l){const n=!l;F={loan:l||{id:uid(),name:'',balance:'',rate:'',payment:'',at:today(),original:0}};const L=F.loan,B=n?'':Math.round(loanNow(L));openDr(n?'Nový úvěr':esc(L.name),`${fld('Název',`<input id="lN" class="in" value="${esc(L.name)}" placeholder="např. Hypotéka" autofocus>`)}<div class="two">${fld('Zbývá doplatit, Kč',`<input id="lB" class="in num" inputmode="numeric" value="${B}">`)}${fld('Úrok % ročně',`<input id="lR" class="in num" inputmode="decimal" value="${L.rate}">`)}</div>${fld('Měsíční splátka, Kč',`<input id="lP" class="in num" inputmode="numeric" value="${L.payment}">`)}${n?`<label class="row"><span class="m"><b>Přidat i do trvalých plateb</b></span><input id="lRc" type="checkbox" class="chk" checked></label>${fld('Den splátky',`<input id="lD" class="in" type="number" min="1" max="31" value="15">`)}`:''}<span class="err" id="lE" hidden></span>${!n?`${fld('Co kdybych měsíčně přidal(a), Kč',`<input id="lX" class="in num" inputmode="numeric" data-c="loanX" placeholder="např. 1000">`)}<div id="lXo" class="note"></div>`:''}`,`${cancelBtn(!n,'loanDel')}<button class="btn p" data-a="loanSave">Uložit</button>`)}

A.loanSave=()=>{const n=$('#lN').value.trim(),b=parseFloat($('#lB').value),r=parseFloat($('#lR').value.replace(',','.'))||0,p=parseFloat($('#lP').value);if(!n||!(b>0)||!(p>0)){const E=$('#lE');E.hidden=false;E.textContent='Vyplň název, zůstatek a splátku.';return}const rc=$('#lRc');const o={...F.loan,name:n,balance:b,rate:r,payment:p,at:today(),original:Math.max(F.loan.original||0,b)};put('loans',o);if(rc&&rc.checked){const d=clamp(+$('#lD').value||15,1,31);put('rec',{id:uid(),name:'Splátka: '+n,amount:p,cat:'uvery',day:d,type:'exp',freq:1,start:ymNow()+'-'+pad(Math.min(d,dim(ymNow()))),auto:true,active:true,who:''});postDue()}log(`Úvěr uložen: ${n}`);closeDr();render();toast('Uloženo.')};

function yearLine(w,months){const H=Math.round(clamp(w*.32,170,230)),L=52,R=8,T=10,B=24,v=months.map(m=>hasData(m)?stats(m).bal:0),mx=Math.max(...v.map(Math.abs),1)*1.1,slot=(w-L-R)/12,bw=Math.min(slot-6,30),zero=(H-B+T)/2,sc=(H-T-B)/2/mx;let o=`<line x1="${L}" x2="${w-R}" y1="${zero}" y2="${zero}" stroke="var(--ink3)"/>`;[1,-1].forEach(s=>o+=`<text x="${L-6}" y="${zero-s*(H-T-B)/2+4}" text-anchor="end">${s<0?'−':''}${kShort(Math.round(mx))}</text>`);o+=`<text x="${L-6}" y="${zero+4}" text-anchor="end">0</text>`;months.forEach((m,i)=>{const x=L+slot*(i+.5),h=Math.max(Math.abs(v[i])*sc,hasData(m)?1:0);if(h)o+=`<rect x="${x-bw/2}" y="${v[i]>=0?zero-h:zero}" width="${bw}" height="${h}" rx="2" fill="${v[i]>=0?'var(--good)':'var(--crit)'}" data-tip="${esc(mL(m)+'\nZůstalo: '+skc(v[i]))}"/>`;o+=`<text x="${x}" y="${H-7}" text-anchor="middle">${mS(m)}</text>`});return`<svg viewBox="0 0 ${w} ${H}" role="img" aria-label="Zůstatek po měsících">${o}</svg>`}
V.rok=()=>{const y=ui.year,ms=[...Array(12)].map((_,i)=>y+'-'+pad(i+1)),act=ms.filter(hasData),px=ms.map(m=>(+y-1)+m.slice(4)),T=act.map(m=>({m,s:stats(m)})),inc=sum(T,t=>t.s.inc),exp=sum(T,t=>t.s.exp),sav=sum(T,t=>t.s.sav),by={};T.forEach(t=>{for(const k in t.s.by)by[k]=(by[k]||0)+t.s.by[k]});const pby={};px.filter(hasData).forEach(m=>{const s=stats(m);for(const k in s.by)pby[k]=(pby[k]||0)+s.by[k]});const hasP=Object.keys(pby).length>0,top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=top.length?top[0][1]:1,exps=[...T].sort((a,b)=>b.s.exp-a.s.exp).slice(0,3),years=[...new Set(S.tx.map(t=>t.date.slice(0,4)))].sort();

function foodWeek(){const d=parseD(today()),mon=addD(today(),-((d.getDay()+6)%7));const spent=sum(S.tx.filter(t=>t.type==='exp'&&t.cat==='potraviny'&&t.date>=mon&&t.date<=today()),t=>t.amount);const lim=budgetsOf(ymNow()).potraviny||(pastMonths(3).length?sum(pastMonths(3),m=>stats(m).by.potraviny||0)/pastMonths(3).length:0);const wk=lim*7/dim(ymNow());const hist=[];for(let i=7;i>=0;i--){const a=addD(mon,-7*i),b=addD(a,6);hist.push({a,v:sum(S.tx.filter(t=>t.type==='exp'&&t.cat==='potraviny'&&t.date>=a&&t.date<=b),t=>t.amount)})}return{mon,spent,lim,wk,hist}}

function simResult(){const c=simCalc(),start=sum(S.acct,acctBal),g=S.goals.filter(x=>x.saved<x.target).sort((a,b)=>(b.target-b.saved)-(a.target-a.saved))[0],gm=s=>s>0&&g?Math.ceil((g.target-g.saved)/s):0,el=$('#simR');if(!el)return;el.innerHTML=`<div class="simr"><div class="stat"><small>Měsíčně zůstane teď</small><div class="kpi">${skc(c.base)}</div></div><div class="stat"><small>Se změnami</small><div class="kpi ${c.nw>=c.base?'ok':'up'}">${skc(c.nw)}</div></div><div class="stat"><small>Rozdíl za rok</small><div class="kpi">${skc(c.delta*12-ui.sim.once)}</div></div></div>${g&&c.nw>0&&c.delta?`<p>Cíl <b>${esc(g.name)}</b> splníte ${c.base>0?`za ${monthsTxt(gm(c.nw))} místo ${monthsTxt(gm(c.base))}`:`za ${monthsTxt(gm(c.nw))}`}.</p>`:''}<div class="lg"><span><i class="sw" style="background:var(--accent)"></i>Se změnami</span><span><i class="sw" style="background:var(--ink3)"></i>Beze změny</span></div><div class="chart" id="simC"></div>${c.b.has?'':'<p class="note">Výpočet bude přesnější po prvním celém měsíci záznamů.</p>'}`;const ch=$('#simC');ch.innerHTML=simChart(Math.max(240,ch.clientWidth),c,start)}

function tagStats(){const m={};S.tx.filter(t=>t.type==='exp').forEach(t=>(t.tags||[]).forEach(g=>{const o=m[g]=m[g]||{g,s:0,n:0,by:{},last:''};o.s+=t.amount;o.n++;o.by[t.cat]=(o.by[t.cat]||0)+t.amount;if(t.date>o.last)o.last=t.date}));return Object.values(m).sort((a,b)=>a.last<b.last?1:-1)}
const tProj=()=>{const T=tagStats(),names=new Set(T.map(t=>t.g)),extra=S.proj.filter(p=>!names.has(p.name));return`<section class="card"><h2>Projekty a štítky <span>štítek přidáš u každého výdaje</span><button class="btn s r" data-a="prNew">Nový projekt</button></h2>${[...T,...extra.map(p=>({g:p.name,s:0,n:0,by:{}}))].map(t=>{const p=S.proj.find(x=>x.name===t.g),pc=p&&p.budget?t.s/p.budget:0;return`<button class="row" style="display:block" data-a="prOpen" data-v="${esc(t.g)}"><div class="bl"><div class="t">#${esc(t.g)} ${pc>1?'<span class="pill crit">nad rozpočet</span>':''}</div><div class="v">${kc(t.s)}${p&&p.budget?' z '+kc(p.budget):''}</div>${p&&p.budget?`<div class="track"><i style="width:${clamp(pc*100,0,100)}%;background:${pc>1?'var(--crit)':'#f2b705'}"></i></div>`:''}</div><small style="color:var(--ink3)">${t.n} výdajů</small></button>`}).join('')||'<div class="empty">Zatím žádné štítky. Přidej třeba „Vánoce 2026“ nebo „Chalupa“.</div>'}</section>`};
const prForm=(name)=>{const p=S.proj.find(x=>x.name===name);form(name?'Projekt: '+esc(name):'Nový projekt',[{k:'name',l:'Název, stejný jako štítek',v:name,req:1},{k:'budget',l:'Rozpočet, Kč',n:1,v:p&&p.budget}],o=>put('proj',{id:p?p.id:uid(),name:o.name,budget:o.budget}),p?()=>del('proj',p.id):null)};
A.prNew=()=>prForm();A.prOpen=e=>prForm(e.dataset.v);
const tUse=()=>{const R=S.rec.filter(r=>r.active!==false&&r.type!=='inc'&&['predplatne','zabava'].includes(r.cat));return`<section class="card"><h2>Cena za použití <span>kolikrát měsíčně to reálně využijete</span></h2>${R.map(r=>{const n=(S.cfg.uses||{})[r.id]||0;return`<div class="row"><span class="m"><b>${esc(r.name)}</b><small>${kc(monthly(r))} měsíčně</small></span><input class="in num" style="width:5rem;text-align:right" id="us_${r.id}" inputmode="numeric" data-c="use" data-id="${r.id}" value="${n||''}" placeholder="0" aria-label="Počet použití"><span class="am" style="min-width:6.5rem">${n?kc(monthly(r)/n)+' / použití':'—'}</span>${n&&monthly(r)/n>100?'<span class="pill warn">drahé</span>':''}</div>`}).join('')||'<div class="empty">Přidej předplatné do trvalých plateb.</div>'}</section>`};
C.use=e=>{S.cfg.uses=S.cfg.uses||{};S.cfg.uses[e.dataset.id]=+e.value||0;saveCfg();render()};
const tCar=()=>{const c=S.cfg.car||{},from=addM(ymNow(),-12),ms=S.tx.filter(t=>t.type==='exp'&&t.date.slice(0,7)>from),fuel=sum(ms.filter(t=>t.cat==='auto'),t=>t.amount),ins=sum(S.rec.filter(r=>r.active!==false&&/ručen|havar/i.test(r.name)),r=>monthly(r)*12),dep=(c.value||0)*(c.dep||0)/100,km=(c.km2&&c.km1&&c.km2>c.km1&&c.d1&&c.d2&&diffD(c.d2,c.d1)>0)?(c.km2-c.km1)/diffD(c.d2,c.d1)*365:0,tot=fuel+ins+dep;return`<div class="grid"><section class="card hero c5"><div class="lbl">Jeden kilometr stojí</div><div class="big">${km?(tot/km).toFixed(2).replace('.',',')+' Kč':'—'}</div><div class="sub">${km?`při ${nb(km)} km ročně`:'Zadej dva stavy tachometru.'}</div></section><section class="card c7"><h2>Náklady za 12 měsíců<button class="btn s r" data-a="carEdit">Upravit</button></h2><div class="rl"><span class="n">Palivo a servis</span><span class="dots"></span><span>${kc(fuel)}</span></div><div class="rl"><span class="n">Pojištění</span><span class="dots"></span><span>${kc(ins)}</span></div><div class="rl"><span class="n">Pokles hodnoty, odhad</span><span class="dots"></span><span>${kc(dep)}</span></div><div class="rl tot"><span>Celkem</span><span class="dots" style="border:0"></span><span>${kc(tot)}</span></div></section></div>`};
A.carEdit=()=>{const c=S.cfg.car||{};form('Auto',[{k:'value',l:'Hodnota auta, Kč',n:1,v:c.value},{k:'dep',l:'Pokles hodnoty % ročně, odhad',n:1,v:c.dep||12},{k:'d1',l:'Datum prvního stavu',t:'date',v:c.d1||addD(today(),-30)},{k:'km1',l:'Tachometr tehdy',n:1,v:c.km1},{k:'d2',l:'Datum posledního stavu',t:'date',v:c.d2||today()},{k:'km2',l:'Tachometr teď',n:1,v:c.km2}],o=>{S.cfg.car=o;saveCfg()})};
const EK={el:['Elektřina','kWh'],gas:['Plyn','kWh'],water:['Voda','m³']};
function enCalc(){return Object.keys(EK).map(k=>{const r=S.meters.filter(m=>m.kind===k).sort((a,b)=>a.date<b.date?-1:1);if(r.length<2)return{k,n:r.length};const days=diffD(r[r.length-1].date,r[0].date),used=r[r.length-1].value-r[0].value;if(days<=0)return{k,n:r.length};const y=used/days*365,t=(S.cfg.tariff||{})[k]||0;return{k,n:r.length,y,cost:y*t,t}})}
const tEn=()=>{const E=enCalc(),tot=sum(E,e=>e.cost||0),zal=sum(S.rec.filter(r=>r.active!==false&&r.cat==='energie'),r=>monthly(r)*12),diff=zal-tot,ok=E.some(e=>e.cost);return`<div class="grid"><section class="card hero c5"><div class="lbl">${ok?(diff>=0?'Odhad přeplatku za rok':'Odhad nedoplatku za rok'):'Výsledek vyúčtování'}</div><div class="big">${ok?kc(Math.abs(diff)):'—'}</div><div class="sub">${ok?`Zálohy ${kc(zal)}, odhad spotřeby ${kc(tot)}.`:'Zadej aspoň dva odečty a ceny za jednotku.'}</div></section><section class="card c7"><h2>Spotřeba<button class="btn s r" data-a="tarEdit">Ceny</button><button class="btn s" data-a="mtNew">Zapsat odečet</button></h2>${E.map(e=>`<div class="res"><b>${EK[e.k][0]}</b><span class="num">${e.y?nb(e.y)+' '+EK[e.k][1]+'/rok':'—'}</span><small>${e.n} odečtů${e.cost?`, odhad ${kc(e.cost)} ročně`:''}</small></div>`).join('')}<div class="lbl">Poslední odečty</div>${[...S.meters].sort((a,b)=>a.date<b.date?1:-1).slice(0,5).map(m=>`<button class="rl" data-a="mtEdit" data-id="${m.id}"><span class="n">${dL(m.date)} ${EK[m.kind][0]}</span><span class="dots"></span><span>${nb(m.value)} ${EK[m.kind][1]}</span></button>`).join('')}<p class="note">Jde o hrubý odhad z variabilní ceny. Stálé platby a sezónnost zahrň do ceny za jednotku.</p></section></div>`};
const mtForm=m=>form('Odečet',[{k:'kind',l:'Co',o:Object.keys(EK).map(k=>[k,EK[k][0]]),v:m?m.kind:'el'},{k:'date',l:'Datum',t:'date',v:m?m.date:today()},{k:'value',l:'Stav měřiče',n:1,v:m&&m.value,req:1}],o=>put('meters',{id:m?m.id:uid(),...o}),m?()=>del('meters',m.id):null);
A.mtNew=()=>mtForm();A.mtEdit=e=>mtForm(S.meters.find(x=>x.id===e.dataset.id));
A.tarEdit=()=>{const t=S.cfg.tariff||{};form('Cena za jednotku, Kč',Object.keys(EK).map(k=>({k,l:EK[k][0]+' / '+EK[k][1],n:1,v:t[k]})),o=>{S.cfg.tariff=o;saveCfg()})};
let CV={loan:{price:300000,rate:7,months:60,yld:3},rent:{price:12000,resale:3000,rent:400,uses:5,years:5},fix:{repair:25000,yearly:12000,years:3,newp:320000,resale:60000,life:8}};
const calcR=()=>{const v=CV[ui.calc],el=$('#clR');if(!el)return;let h='';if(ui.calc==='loan'){const r=v.rate/1200,P=r?v.price*r/(1-Math.pow(1+r,-v.months)):v.price/v.months,tot=P*v.months,lost=v.price*(Math.pow(1+v.yld/1200,v.months)-1),int=tot-v.price;h=`<div class="simr"><div class="stat"><small>Splátka</small><div class="kpi">${kc(P)}</div></div><div class="stat"><small>Úroky celkem</small><div class="kpi">${kc(int)}</div></div><div class="stat"><small>Ušlý výnos při platbě hotově</small><div class="kpi">${kc(lost)}</div></div></div><p><b>${int>lost?`Hotovost vychází lépe o ${kc(int-lost)}`:`Splátky vycházejí lépe o ${kc(lost-int)}`}</b>, pokud máš peníze bokem a neoslabí to rezervu.</p>`}if(ui.calc==='rent'){const b=v.price-v.resale,re=v.rent*v.uses*v.years,be=v.rent?b/v.rent:0;h=`<div class="simr"><div class="stat"><small>Koupě stojí</small><div class="kpi">${kc(b)}</div></div><div class="stat"><small>Půjčování stojí</small><div class="kpi">${kc(re)}</div></div><div class="stat"><small>Bod zvratu</small><div class="kpi">${nb(be)}× použití</div></div></div><p><b>${b<re?`Koupě ušetří ${kc(re-b)}`:`Půjčování ušetří ${kc(b-re)}`}</b> za ${v.years} let.</p>`}if(ui.calc==='fix'){const a=(v.repair+v.yearly*v.years)/Math.max(v.years,1),n=(v.newp-v.resale)/Math.max(v.life,1);h=`<div class="simr"><div class="stat"><small>Oprava, ročně</small><div class="kpi">${kc(a)}</div></div><div class="stat"><small>Nové, ročně</small><div class="kpi">${kc(n)}</div></div></div><p><b>${a<n?`Oprava vychází lépe o ${kc(n-a)} ročně`:`Nové vychází lépe o ${kc(a-n)} ročně`}</b>. Výpočet nezahrnuje palivo ani spolehlivost.</p>`}el.innerHTML=h};
const CF={loan:[['price','Cena, Kč'],['rate','Úrok % ročně'],['months','Počet měsíců'],['yld','Výnos úspor % ročně']],rent:[['price','Cena koupě, Kč'],['resale','Cena při prodeji, Kč'],['rent','Půjčení za 1×, Kč'],['uses','Použití za rok'],['years','Roky']],fix:[['repair','Oprava teď, Kč'],['yearly','Další opravy ročně, Kč'],['years','Vydrží ještě let'],['newp','Cena nového, Kč'],['resale','Hodnota po době používání, Kč'],['life','Budu používat let']]};
const tCalc=()=>`<div class="grid"><section class="card c5"><h2>Zadání</h2>${tabsH('calc',[['loan','Splátky nebo hotovost'],['rent','Koupit nebo půjčit'],['fix','Opravit nebo nové']])}<div class="two">${CF[ui.calc].map(([k,l])=>fld(l,`<input id="cl_${k}" class="in num" inputmode="decimal" data-c="calc" data-k="${k}" value="${CV[ui.calc][k]}">`)).join('')}</div></section><section class="card c7"><h2>Výsledek <span>orientační výpočet</span></h2><div id="clR" class="stack"></div></section></div>`;
C.calc=e=>{CV[ui.calc][e.dataset.k]=parseFloat(e.value.replace(',','.'))||0;calcR()};

function taxData(y){const ms=[...Array(12)].map((_,i)=>y+'-'+pad(i+1));const pick=re=>S.tx.filter(t=>t.type==='exp'&&t.date.startsWith(y)&&(re.test(t.note)||(t.tags||[]).some(g=>re.test(g))));const life=pick(/život|penzijn/i),gift=pick(/\bdar\b|sbírk|charit/i);let intr=0;S.loans.filter(l=>l.mortgage).forEach(l=>{let B=l.balance;const r=(l.rate||0)/1200;ms.forEach(()=>{const i=B*r;intr+=i;B=Math.max(0,B+i-l.payment)})});return{life,gift,intr}}
const tTax=()=>{const y=ui.taxY,d=taxData(y),yrs=[...new Set([...S.tx.map(t=>t.date.slice(0,4)),ymNow().slice(0,4)])].sort();return`<section class="card"><h2>Podklady k dani za rok ${y}<button class="btn s r" data-a="taxCsv">Export CSV</button></h2>${tabsH('taxY',yrs.map(v=>[v,v]))}<div class="res"><b>Životní a penzijní pojištění</b><span class="num">${kc(sum(d.life,t=>t.amount))}</span><small>${d.life.length} plateb s tímto názvem nebo štítkem</small></div><div class="res"><b>Dary</b><span class="num">${kc(sum(d.gift,t=>t.amount))}</span><small>Označ je štítkem „dar“</small></div><div class="res"><b>Úroky z hypotéky, odhad</b><span class="num">${kc(d.intr)}</span><small>Z úvěrů označených jako hypotéka: ${S.loans.filter(l=>l.mortgage).map(l=>esc(l.name)).join(', ')||'žádný'}</small></div>${S.loans.map(l=>`<label class="row"><span class="m"><b>${esc(l.name)}</b><small>Počítat jako hypotéku</small></span><input id="mg_${l.id}" type="checkbox" class="chk" data-c="mort" data-id="${l.id}" ${l.mortgage?'checked':''}></label>`).join('')}<p class="note">Jde jen o přehled ze zápisů. Limity a podmínky odpočtů ověř podle aktuálních pravidel a potvrzení od banky, pojišťovny a obdarovaných.</p></section>`};
C.mort=e=>{const l=S.loans.find(x=>x.id===e.dataset.id);put('loans',{...l,mortgage:e.checked});render()};
A.taxCsv=()=>{const d=taxData(ui.taxY);saveFile(`dane-${ui.taxY}.csv`,csvLines([...d.life,...d.gift]),'text/csv')};

function toIban(a){a=String(a||'').replace(/\s/g,'').toUpperCase();if(/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(a))return a;const m=a.match(/^(?:(\d{1,6})-)?(\d{2,10})\/(\d{4})$/);if(!m)return null;const b=m[3]+(m[1]||'').padStart(6,'0')+m[2].padStart(10,'0');const c=98n-BigInt(b+'123500')%97n;return'CZ'+String(c).padStart(2,'0')+b}

function hhView(){gate(`<h2>Domácnost</h2><p class="note">Založ novou domácnost, nebo se připoj kódem od partnera.</p><button class="btn p" data-a="gNew">Založit domácnost</button>${fld('Kód pozvánky','<input id="gC" class="in" autocomplete="off" style="text-transform:uppercase">')}<button class="btn" data-a="gJoin">Připojit se</button><button class="lnk" type="button" data-a="logout">Odhlásit se</button>`)}
const newCode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',v=crypto.getRandomValues(new Uint8Array(8));return[...v].map(x=>a[x%a.length]).join('')};
A.gNew=async()=>{try{const D=firebase.firestore(),h=D.collection('households').doc(),code=newCode();await h.set({members:[fbU.uid],code});await D.collection('invites').doc(code).set({hid:h.id});await D.collection('users').doc(fbU.uid).set({hid:h.id});enter(h.id)}catch(e){gErr(e)}};
A.gJoin=async()=>{try{const D=firebase.firestore(),code=$('#gC').value.trim().toUpperCase();const s=await D.collection('invites').doc(code).get();if(!s.exists){$('#gE').textContent='Kód neexistuje.';return}const hid=s.data().hid;await D.collection('households').doc(hid).update({members:firebase.firestore.FieldValue.arrayUnion(fbU.uid),lastCode:code});await D.collection('users').doc(fbU.uid).set({hid});enter(hid)}catch(e){gErr(e)}};
function enter(hid){const g=$('#gate');g&&g.remove();fbH=hid;window.__fbDb=fbDb(hid,fbU.uid);window.__fbUser={id:async()=>fbU.uid};if(lsG('uid')!==fbU.uid){['live','cache','q','win'].forEach(k=>lsS(k,null));lsS('uid',fbU.uid)}start()}
A.logout=()=>{['live','cache','q','win','uid'].forEach(k=>lsS(k,null));firebase.auth().signOut().then(()=>location.reload())};
A.copyCode=e=>{const c=e.dataset.v;navigator.clipboard.writeText(c).then(()=>toast('Kód zkopírován.'),()=>toast('Kód: '+c))};
A.install=async()=>{if(!instP)return;instP.prompt();await instP.userChoice;instP=null;render()};
/* upozornění v zařízení */
A.notifOn=async()=>{if(!('Notification'in window))return toast('Tento prohlížeč upozornění neumí.','e');const p=await Notification.requestPermission();lsS('ntf',p==='granted'?'1':'0');render();if(p==='granted'){lsS('ntfDay',null);pushNow()}else toast('Upozornění nejsou povolená.','e')};
A.notifOff=()=>{lsS('ntf','0');render()};
async function pushNow(){if(lsG('ntf')!=='1'||Notification.permission!=='granted'||lsG('ntfDay')===today())return;const n=notices().filter(x=>x.l!=='info');lsS('ntfDay',today());if(!n.length)return;const body=n.slice(0,4).map(x=>x.t).join('\n');try{const r=await navigator.serviceWorker.ready;r.showNotification('Rodinná kasa',{body,icon:'icon-192.png',badge:'icon-192.png'})}catch(e){try{new Notification('Rodinná kasa',{body})}catch(x){}}}
/* otisk prstu */
const b64u={to:b=>btoa(String.fromCharCode(...new Uint8Array(b))),from:s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const bioOK=()=>!!(window.PublicKeyCredential&&navigator.credentials&&!window.claude);
A.bioSet=async()=>{if(!lsG('pinh'))return toast('Nejdřív nastav PIN.','e');try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Rodinná kasa'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'kasa',displayName:'Rodinná kasa'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});lsS('bio',b64u.to(c.rawId));render();toast('Otisk je nastavený.')}catch(e){toast('Otisk se nepodařilo nastavit.','e')}};
A.bioOff=()=>{lsS('bio',null);render()};
A.bioGo=async()=>{try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:b64u.from(lsG('bio'))}],userVerification:'required',timeout:60000}});const l=$('#lock');l&&l.remove();pinIn=''}catch(e){const x=$('#lkE');if(x)x.textContent='Otisk se nepodařil, zadej PIN.'}};
const lkBase=lockShow;lockShow=function(){lkBase();if(lsG('bio')&&bioOK()){const f=$('#lock [data-a=pinForgot]');f&&f.insertAdjacentHTML('beforebegin','<button class="btn p" data-a="bioGo">Odemknout otiskem</button>')}};
/* nastavení */
const st3=V.nastaveni;V.nastaveni=()=>{const fb=fbU&&fbH;let hh='';if(fb){hh=`<section class="card c6"><h2>Účet a domácnost</h2><div class="row"><span class="m"><b>${esc(fbU.email)}</b><small>Přihlášený účet</small></span><button class="btn s" data-a="logout">Odhlásit</button></div><div class="row"><span class="m"><b id="hhC">${esc(ui.code||'…')}</b><small>Kód pro partnera, zadá ho po registraci</small></span><button class="btn s" data-a="copyCode" data-v="${esc(ui.code||'')}">Kopírovat</button></div></section>`;if(!ui.code)firebase.firestore().collection('households').doc(fbH).get().then(s=>{ui.code=s.data().code;render()}).catch(()=>{})}const ios=/iphone|ipad/i.test(navigator.userAgent);const dev=window.claude?'':`<section class="card c6"><h2>Telefon</h2>${instP?'<button class="btn p" style="align-self:flex-start" data-a="install">Nainstalovat na plochu</button>':`<p class="note">${ios?'V Safari klepni na Sdílet a zvol Přidat na plochu.':'Instalaci nabídne prohlížeč v nabídce Přidat na plochu.'}</p>`}<div class="row"><span class="m"><b>Upozornění</b><small>Při otevření aplikace, jednou denně</small></span><button class="btn s" data-a="${lsG('ntf')==='1'?'notifOff':'notifOn'}">${lsG('ntf')==='1'?'Vypnout':'Zapnout'}</button></div>${bioOK()?`<div class="row"><span class="m"><b>Otisk prstu nebo obličej</b><small>Odemknutí místo PINu</small></span><button class="btn s" data-a="${lsG('bio')?'bioOff':'bioSet'}">${lsG('bio')?'Vypnout':'Nastavit'}</button></div>`:''}</section>`;return st3().replace(/<\/div>$/,hh+dev+'</div>')};
const ap3=apply;apply=function(d,f){ap3(d,f);if(mode==='live'&&f!==false&&'serviceWorker'in navigator)pushNow().catch(()=>{})};
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
function appStart(){if(typeof __TEST__!=='undefined')return;if(FB()){prefs();firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{}).finally(()=>{firebase.auth().onAuthStateChanged(async u=>{if(!u){fbU=null;loginView(false);return}fbU=u;if(fbH)return;gate('<div class="skel" style="height:4rem"></div>');try{const s=await firebase.firestore().collection('users').doc(u.uid).get();s.exists&&s.data().hid?enter(s.data().hid):hhView()}catch(e){hhView();gErr(e)}})})}else start()}
appStart();
</script>

</body></html>
